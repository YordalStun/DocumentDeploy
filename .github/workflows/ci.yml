name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Test (Core logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/DocumentDeploy.Tests/DocumentDeploy.Tests.csproj

      - name: Test
        run: dotnet test src/DocumentDeploy.Tests/DocumentDeploy.Tests.csproj --configuration Release --no-restore

  build-windows-app:
    name: Build WPF app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DocumentDeploy.sln

      - name: Build
        run: dotnet build DocumentDeploy.sln --configuration Release --no-restore
