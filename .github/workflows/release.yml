name: Release Windows build

# Runs when a version tag (e.g. v1.0.0) is pushed, or on demand via the Actions tab/API - not on
# every commit - to keep this an occasional, deliberate action rather than something that fires
# on every push.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DocumentDeploy.sln

      - name: Run tests
        run: dotnet test src/DocumentDeploy.Tests/DocumentDeploy.Tests.csproj --configuration Release --no-restore

      - name: Determine version and tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish src/DocumentDeploy.App/DocumentDeploy.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          --output publish

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath DocumentDeploy-${{ steps.version.outputs.version }}-win-x64.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ steps.version.outputs.tag }}" `
            "DocumentDeploy-${{ steps.version.outputs.version }}-win-x64.zip" `
            --title "DocumentDeploy ${{ steps.version.outputs.tag }}" `
            --target "${{ github.sha }}" `
            --generate-notes
